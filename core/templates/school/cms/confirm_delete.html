{% extends 'school/cms/base.html' %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
  <a href="{{ back_url }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h5 class="fw-bold mb-0 text-danger">{{ title }}</h5>
</div>

<div class="card border-danger border-0 shadow-sm" style="max-width:480px;">
  <div class="card-body p-4 text-center">
    <div class="mb-3">
      <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem;"></i>
    </div>
    <h6 class="fw-bold mb-2">Вы уверены?</h6>
    <p class="text-muted mb-4">
      Будет удалено: <strong>{{ object_name }}</strong><br>
      <small>Это действие нельзя отменить.</small>
    </p>
    <form method="post" class="d-flex gap-2 justify-content-center">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">
        <i class="bi bi-trash me-1"></i>Удалить
      </button>
      <a href="{{ back_url }}" class="btn btn-outline-secondary">Отмена</a>
    </form>
  </div>
</div>
{% endblock %}
