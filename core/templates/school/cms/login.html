{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS — Вход</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      background: linear-gradient(135deg, #1a0a5e 0%, #28156f 60%, #0d6efd 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cms-card {
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .cms-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #0d6efd, #6610f2);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 3px rgba(13,110,253,.15); }
    .btn-cms { background: linear-gradient(135deg, #0d6efd, #6610f2); border: none; }
    .btn-cms:hover { opacity: .9; }
  </style>
</head>
<body>
  <div class="cms-card card border-0 p-4">

    <div class="text-center mb-4">
      <div class="cms-logo mx-auto mb-3">
        <i class="bi bi-pencil-square text-white fs-4"></i>
      </div>
      <h5 class="fw-bold mb-0">Азия Старт — CMS</h5>
      <small class="text-muted">Управление контентом сайта</small>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small">
      <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {% if request.GET.next %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
      {% endif %}

      <div class="mb-3">
        <label class="form-label small fw-semibold">Логин</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input type="text" name="username" class="form-control border-start-0"
                 placeholder="Введите логин" autofocus required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold">Пароль</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" name="password" id="passwordInput"
                 class="form-control border-start-0" placeholder="Введите пароль" required>
          <button type="button" class="btn btn-outline-secondary"
                  onclick="togglePwd()" tabindex="-1">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-cms btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Войти в CMS
      </button>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'home' %}" class="text-muted small text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i>Вернуться в систему
      </a>
    </div>
  </div>

  <script>
    function togglePwd() {
      const inp = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        inp.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }
  </script>
</body>
</html>
